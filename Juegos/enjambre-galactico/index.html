<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Enjambre Galáctico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">

</head>
<body>
<div id="stage"><canvas id="game" aria-label="Enjambre Galáctico, juego de naves"></canvas></div>
<div id="pad">

  <button class="pbtn" id="bR" data-k="right" aria-label="Derecha">&gt;</button>

</div>
<script src="game.js"></script>
