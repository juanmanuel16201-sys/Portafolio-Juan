  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      var m = 'auto';

      } catch (e) { /* sin almacenamiento */ }
      var h = new Date().getHours();
      d.setAttribute('data-bs-theme', m === 'auto' ? (h >= 6 && h < 18 ? 'light' : 'dark') : m);
      d.setAttribute('data-modo', m);
    }());
